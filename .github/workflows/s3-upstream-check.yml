name: Check S3 changes against upstream

on:
  push:
    branches: [agent/s3-build-pipeline]
    paths: [.github/workflows/s3-upstream-check.yml]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the pinned S3 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: 0cwa/continuwuity
          ref: 1c0abdccc4e47d63bd828f59da8a2f82396c265c
          fetch-depth: 0
          persist-credentials: false
      - name: Check for textual conflicts with current upstream
        run: |
          set -eu
          git fetch --no-tags https://forgejo.ellis.link/continuwuation/continuwuity.git refs/heads/main
          upstream=$(git rev-parse FETCH_HEAD)
          printf 'Upstream main: %s\nS3 branch: %s\n' "$upstream" "$(git rev-parse HEAD)"
          git merge-tree --write-tree "$upstream" HEAD
          echo 'Textual merge succeeded; building and testing is still required.'
