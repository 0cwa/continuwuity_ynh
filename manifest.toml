#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json
packaging_format = 2

id = "continuwuity"
name = "Continuwuity"
description.en = "Community maintained Matrix homeserver with optional YunoHost login through Dex"
version = "26.11.0-alpha.2~ynh2"
maintainers = ["0cwa"]

[upstream]
license = "Apache-2.0"
website = "https://continuwuity.org/"
admindoc = "https://continuwuity.org/deploying/generic"
userdoc = "https://continuwuity.org/authentication/"
code = "https://forgejo.ellis.link/continuwuation/continuwuity"

[integration]
yunohost = ">= 12.1.18"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
# Password mode has independent accounts. Optional Dex provides YunoHost
# credentials through OIDC, rather than a direct LDAP or SSOwat integration.
ldap = false
sso = false
disk = "300M"
ram.build = "100M"
ram.runtime = "512M"

[install]
    # Keep translated help on one physical line. YunoHost's toml decoder
    # misplaces the locale key when dotted keys use multiline strings.
    [install.domain]
    type = "domain"
    help.en = "Recommended: a dedicated subdomain such as matrix.example.org. YunoHost may preselect or star its main domain; choose the hostname you want for this app. This is the public homeserver address: it serves the Matrix API, a welcome page, and personal account pages. A chat client and a server administration dashboard are not included. Manage package settings in YunoHost and server users/rooms through a Matrix client's admin room.\n\nThis app reserves the whole selected web domain at /. Choosing example.org assigns https://example.org/ to Continuwuity and prevents another web app from sharing that domain. Existing homepage redirects may still affect what opens there; YunoHost's own admin and portal URLs remain available. To keep your root website or portal and still get @alice:example.org, choose matrix.example.org here and enter example.org in the Matrix identity field below.\n"

    [install.server_name]
    ask.en = "Permanent Matrix identity domain (for example, example.org)"
    help.en = "This is the suffix after : in Matrix IDs. With installation domain matrix.example.org, enter example.org for @alice:example.org, or leave this field empty for @alice:matrix.example.org. Using example.org here does not put the homeserver on your root homepage: the package adds only Matrix discovery URLs there.\n\nA different identity domain must already exist on this YunoHost server, with working DNS and HTTPS and available /.well-known/matrix/* paths. You must keep control of this domain. The Matrix identity cannot be renamed after installation, even if you later change the installation domain.\n"
    type = "string"
    optional = true
    default = ""

    [install.admin]
    type = "user"
    help.en = "This YunoHost username will become the first Matrix administrator. The Matrix account has its own initial password."

    [install.password]
    help.en = "Independent of the YunoHost password. Required in Dex mode to link the administrator account. This initial password cannot contain whitespace; it can be changed in a Matrix client later."
    type = "password"

    [install.auth_type]
    ask.en = "Authentication"
    type = "select"
    choices.password = "Local Matrix accounts (widest client compatibility)"
    choices.dex = "YunoHost accounts through Dex (requires an installed Dex app and OAuth-capable clients)"
    default = "password"

    [install.media_backend]
    ask.en = "Media storage backend"
    help.en = "Choose once during installation. Existing media is not migrated if storage changes; the package blocks later backend changes. Local storage uses the official upstream alpha. S3 uses an experimental fork maintained by this package developer (0cwa), not upstream, and requires a separate snapshot bucket. Neither alpha is production-ready."
    type = "select"
    choices.local = "Local filesystem (recommended default)"
    choices.s3 = "S3-compatible object storage (experimental 0cwa fork)"
    default = "local"

    [install.media_s3_endpoint]
    ask.en = "S3-compatible endpoint"
    help.en = "HTTPS endpoint for a compatible object store. Leave empty for AWS S3. Plain HTTP is not permitted."
    type = "url"
    optional = true
    default = ""
    visible = "media_backend == 's3'"

    [install.media_s3_bucket]
    ask.en = "Live media bucket"
    help.en = "Lowercase 3-63 character S3 bucket name for live Matrix media."
    type = "string"
    visible = "media_backend == 's3'"

    [install.media_s3_backup_bucket]
    ask.en = "Media snapshot bucket"
    help.en = "Required separate bucket for remote snapshots, in the same S3 service, endpoint and region as live media. It must differ from the live media bucket."
    type = "string"
    visible = "media_backend == 's3'"

    [install.media_s3_region]
    ask.en = "S3 region"
    help.en = "Region used to sign S3 requests."
    type = "string"
    default = "us-east-1"
    visible = "media_backend == 's3'"

    [install.media_s3_key_prefix]
    ask.en = "Live media key prefix"
    help.en = "A unique nonempty object-key prefix for this app instance. The package defaults it to the app ID plus /media."
    type = "string"
    optional = true
    default = ""
    visible = "media_backend == 's3'"

    [install.media_s3_access_key_id]
    ask.en = "Optional S3 access key ID"
    help.en = "Only used with S3. Leave blank for local media. Supply both key fields when using static credentials; the same identity is used for live media and remote snapshots."
    type = "password"
    optional = true

    [install.media_s3_secret_access_key]
    ask.en = "Optional S3 secret access key"
    help.en = "Only used with S3. Leave blank for local media. Supply both key fields when using static credentials. Stored in protected generated server configuration."
    type = "password"
    optional = true

    [install.dex_app]
    ask.en = "Existing Dex application"
    help.en = "Install Dex with working HTTPS first. Its default LDAP connector admits all YunoHost users. Continuwuity registers its OIDC client automatically."
    type = "app"
    filter = "match(id, '^dex(__[0-9]+)?$')"
    visible = "auth_type == 'dex'"
    optional = true

[resources]
    [resources.sources.main]
    # Official upstream release; local media uses this binary.
    prefetch = false
    amd64.url = "https://forgejo.ellis.link/continuwuation/continuwuity/releases/download/v26.11.0-alpha.2/conduwuit-linux-static-amd64"
    amd64.sha256 = "478bc4fe23db0bca5729e8777555f9127a820cf3d484454e79ffe60805b01a7f"
    arm64.url = "https://forgejo.ellis.link/continuwuation/continuwuity/releases/download/v26.11.0-alpha.2/conduwuit-linux-static-arm64"
    arm64.sha256 = "20889aa933055e0f24fdc13f9f728ac2d386de9bd517437780353b8e0ae12539"
    extract = false
    rename = "continuwuity"

    [resources.sources.s3]
    # Package maintainer's fork; only selected for the experimental S3 mode.
    prefetch = false
    amd64.url = "https://github.com/0cwa/continuwuity/releases/download/s3-candidate-2026-11-16/conduwuit-linux-static-amd64"
    amd64.sha256 = "facf50a7ef577b120f3eb05c54fe631ef57c75a22fb6349a40c60e56b35b63e2"
    arm64.url = "https://github.com/0cwa/continuwuity/releases/download/s3-candidate-2026-11-16/conduwuit-linux-static-arm64"
    arm64.sha256 = "4d6ab130433207d9332bf051444e73a72cd68352c2dbd8274524fdc7f321dcca"
    extract = false
    rename = "continuwuity"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]
    owner = "root:rwx"
    group = "__APP__:rx"

    [resources.data_dir]
    owner = "__APP__:rwx"
    group = "__APP__:---"

    [resources.permissions.main]
    url = "/"
    allowed = "visitors"
    auth_header = false
    protected = true

    [resources.ports]
    main.default = 8008
    # The backend listens on loopback. Only YunoHost's HTTPS port is public.

    [resources.apt]
    packages = ["ca-certificates", "curl", "python3", "python3-yaml"]
    packages_from_raw_bash = """
    if [[ "${media_backend:-local}" == "s3" ]]; then
        echo rclone
    fi
    """
