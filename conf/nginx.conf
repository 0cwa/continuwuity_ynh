# Keep Matrix bearer tokens and signed federation Authorization headers intact.
# SSOwat's permission for this API is public; Matrix/OIDC handles authentication.
location / {
    proxy_pass http://127.0.0.1:__PORT__;
    include proxy_params_no_auth;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    client_max_body_size __MAX_UPLOAD_SIZE__M;
}

# Never expose a future or locally enabled metrics endpoint on the public API.
location = /metrics { return 404; }
location ^~ /metrics/ { return 404; }
