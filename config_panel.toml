#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/config_panel.v1.schema.json
version = "1.0"

[main]
name.en = "Homeserver"

    [main.storage]
    name.en = "Media storage"

        [main.storage.media_backend]
        ask.en = "Media storage backend"
        type = "string"
        readonly = true
        help.en = "Selected during installation. Changing between local and S3 requires a completed media migration."

        [main.storage.media_s3_endpoint]
        ask.en = "S3-compatible endpoint"
        type = "url"
        readonly = true
        optional = true
        visible = "media_backend == 's3'"

        [main.storage.media_s3_bucket]
        ask.en = "Live media bucket"
        type = "string"
        readonly = true
        visible = "media_backend == 's3'"

        [main.storage.media_s3_backup_bucket]
        ask.en = "Media snapshot bucket"
        type = "string"
        readonly = true
        visible = "media_backend == 's3'"
        help.en = "Must be a different bucket in the same S3 service, endpoint and region as live media."

        [main.storage.media_s3_region]
        ask.en = "S3 region"
        type = "string"
        readonly = true
        visible = "media_backend == 's3'"

        [main.storage.media_s3_key_prefix]
        ask.en = "Live media key prefix"
        type = "string"
        readonly = true
        visible = "media_backend == 's3'"
        help.en = "Each app instance has its own prefix. Changing it requires a media migration."

        [main.storage.media_s3_access_key_id]
        ask.en = "S3 access key ID"
        type = "password"
        optional = true
        redact = true
        visible = "media_backend == 's3'"
        help.en = "Required for the matching remote snapshot bucket. Rotate with the secret key below."

        [main.storage.media_s3_secret_access_key]
        ask.en = "S3 secret access key"
        type = "password"
        optional = true
        redact = true
        visible = "media_backend == 's3'"
        help.en = "Required with the access key ID. Stored in protected generated server configuration."

    [main.identity]
    name.en = "Identity and authentication"

        [main.identity.domain]
        ask.en = "Installation domain (web/API address)"
        type = "string"
        readonly = true
        help.en = "Serves the Matrix API, welcome page, and personal account pages. Manage package settings here and Matrix users/rooms in a client's admin room. Move this address with YunoHost's Change URL action; the Matrix identity below stays the same."

        [main.identity.server_name]
        ask.en = "Permanent Matrix identity domain"
        type = "string"
        readonly = true
        help.en = "Permanent suffix in @user:example.org and room aliases. It can differ from the installation domain above. Moving the web/API address does not rename Matrix IDs; keep this domain's DNS and HTTPS working."

        [main.identity.admin]
        ask.en = "Initial Matrix administrator"
        type = "string"
        readonly = true

        [main.identity.auth_type]
        ask.en = "Authentication mode"
        type = "string"
        readonly = true
        help.en = "Changing authentication requires an account migration. See doc/DEX.md."

    [main.accounts]
    name.en = "Local accounts"

        [main.accounts.allow_registration]
        ask.en = "Allow local account registration with a token"
        type = "boolean"
        yes = "true"
        no = "false"
        help.en = "New local accounts must supply the secret token below. In Dex mode, successful identity-provider authentication controls account creation instead."

        [main.accounts.registration_token]
        ask.en = "Local registration token"
        type = "password"
        redact = true
        optional = false
        help.en = "Share only with invited users. Rotating it does not revoke tokens created through the upstream admin commands."

        [main.accounts.smtp_enabled]
        ask.en = "Enable YunoHost email for account recovery"
        type = "boolean"
        yes = "true"
        no = "false"
        help.en = "Uses the app's SMTP identity over STARTTLS on port 587. The installation domain needs a trusted TLS certificate and working mail DNS."

    [main.limits]
    name.en = "Uploads and logging"

        [main.limits.max_upload_size]
        ask.en = "Maximum upload size (MiB)"
        type = "number"
        min = 1
        max = 1024

        [main.limits.log_level]
        ask.en = "Log level"
        type = "select"
        choices = ["error", "warn", "info", "debug"]
        help.en = "Use debug temporarily when troubleshooting; detailed logs can contain personal information."

[calls]
name.en = "Calls"

    [calls.turn]
    name.en = "Existing TURN server"

        [calls.turn.turn_uris]
        ask.en = "TURN URIs"
        type = "tags"
        optional = true
        help.en = "Comma-separated turn: or turns: URIs, for example turn:turn.example.org:3478?transport=udp. This configures an existing relay; it does not install one or open relay ports."

        [calls.turn.turn_secret]
        ask.en = "TURN shared secret"
        type = "password"
        optional = true
        redact = true
        help.en = "Must match the TURN server's static authentication secret."

        [calls.turn.turn_ttl]
        ask.en = "TURN credential lifetime (seconds)"
        type = "number"
        min = 60
        max = 604800

    [calls.matrixrtc]
    name.en = "Existing MatrixRTC service"

        [calls.matrixrtc.rtc_service_url]
        ask.en = "LiveKit authorization service URL"
        type = "url"
        optional = true
        help.en = "HTTPS URL of an existing MatrixRTC LiveKit authorization service, not the LiveKit websocket URL. Leave empty to disable its discovery."
